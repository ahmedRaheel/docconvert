services:
  pagewise:
    build: .
    image: pagewise:latest
    container_name: pagewise
    restart: unless-stopped
    ports:
      # Host port 8081 by default so it doesn't collide with the app you already run.
      # Use PAGEWISE_BIND=127.0.0.1 when a reverse proxy on the same host sits in front.
      - "${PAGEWISE_BIND:-0.0.0.0}:${PAGEWISE_PORT:-8081}:8000"
    environment:
      APP_NAME: "${APP_NAME:-Pagewise}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-50}"
      RESULT_TTL_SECONDS: "${RESULT_TTL_SECONDS:-1800}"
      MAX_CONCURRENT_CONVERSIONS: "${MAX_CONCURRENT_CONVERSIONS:-2}"
      CONVERSION_TIMEOUT: "${CONVERSION_TIMEOUT:-180}"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:-}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD:-}"
    volumes:
      - pagewise-data:/data
    mem_limit: 2g
    # join the network of your existing stack so its nginx can reach http://pagewise:8000
    # networks: [default, existing_network]

  # HTTPS front end (automatic Let's Encrypt certificate). Off by default; start it with:
  #   docker compose --profile https up -d
  # Needs DOMAIN set in .env and ports 80 + 443 open in the security group.
  caddy:
    image: caddy:2
    profiles: ["https"]
    container_name: pagewise-caddy
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:-}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-50}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pagewise

volumes:
  pagewise-data:
  caddy-data:
  caddy-config:

